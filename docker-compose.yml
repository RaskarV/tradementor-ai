# Local development: Redis, optional local Postgres+pgvector, and the backend.
#   docker compose up redis                       -> just Redis (use Supabase for the database)
#   docker compose --profile localdb up           -> everything local
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  db:
    image: pgvector/pgvector:pg16
    profiles: ["localdb"]
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: tradementor }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    profiles: ["localdb"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tradementor
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [redis, db]
volumes:
  pgdata:
